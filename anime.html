<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="宝可梦电视动画与剧场版电影：宝可梦地平线、旅途、太阳&月亮，以及经典剧场版。">
<title>电视动画 / 电影 · Pokémon Hub</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="anime">
<a class="skip-link" href="#main">跳到主要内容</a>
<div id="siteHeader"></div>
<main id="main">
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">首页</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span>电视动画 / 电影</span></div>
      <div class="page-eyebrow">ANIMATION &amp; FILM</div>
      <h1 class="page-title">在屏幕里，<br><span class="accent">继续一起冒险。</span></h1>
      <p class="page-desc">电视动画、剧场版与特别篇。无论是第一次相遇，还是多年后的重逢，故事始终在向前。</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="anime-hero" id="animeHero"></div>
    </div>
  </section>

  <section class="section" style="padding-top:20px">
    <div class="container">
      <div class="anime-tabs">
        <button class="anime-tab active" data-anime-tab="series">电视动画</button>
        <button class="anime-tab" data-anime-tab="movies">剧场版电影</button>
      </div>
      <div id="animeSeriesPanel">
        <div class="episode-layout">
          <div>
            <div class="section-head" style="margin-bottom:18px"><div><div class="section-kicker">LATEST EPISODES</div><h2 class="section-title" style="font-size:30px">最新剧集</h2><p class="section-sub">天空继承者篇 · 每周五更新</p></div></div>
            <div class="episode-list" id="episodeList"></div>
          </div>
          <aside class="aside-panel">
            <h3>系列回顾</h3>
            <div id="seriesList"></div>
            <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
              <div style="display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);line-height:1.7"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>演示站点不提供片源，观看请前往官方频道。</span></div>
              <a class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" href="https://www.youtube.com/@PokemonHongKong" target="_blank" rel="noopener">官方动画频道 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
            </div>
          </aside>
        </div>
      </div>
      <div id="animeMoviesPanel" hidden>
        <div class="section-head" style="margin-bottom:22px"><div><div class="section-kicker">MOVIE COLLECTION</div><h2 class="section-title" style="font-size:30px">剧场版，是更大的相遇</h2><p class="section-sub">从 1998 年至今，每一部剧场版都是一次独立的夏天。</p></div></div>
        <div class="movie-grid" id="movieGrid"></div>
      </div>
    </div>
  </section>
</main>
<div id="siteFooter"></div>
<script src="assets/pokedex.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
