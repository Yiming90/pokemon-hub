<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pokémon Hub 训练家会员中心：查看订单、收藏与账户设置。">
<title>训练家中心 · Pokémon Hub</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="account">
<a class="skip-link" href="#main">跳到主要内容</a>
<div id="siteHeader"></div>
<main id="main">
  <section class="page-hero" style="padding:42px 0 88px">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">首页</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span>训练家中心</span></div>
      <div class="page-eyebrow">TRAINER ACCOUNT</div>
      <h1 class="page-title">你的训练家档案</h1>
      <p class="page-desc">订单、收藏与会员积分，都在这里。所有数据仅保存在当前浏览器。</p>
    </div>
  </section>
  <div class="container">
    <div class="account-shell" style="margin-top:-58px">
      <aside class="account-side">
        <div class="account-profile"><span class="account-avatar">🎒</span><div><b id="accountSideName">训练家</b><span>Pokémon Hub Member</span></div></div>
        <nav class="account-nav">
          <a href="#orders" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg> 我的订单</a>
          <a href="#favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.7-7.5 1.1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></svg> 我的收藏</a>
          <a href="#settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg> 账户设置</a>
          <a href="pokedex.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h6M15 12h6"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg> 宝可梦图鉴</a>
          <a href="goods.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg> 继续购物</a>
          <button data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg> 退出登录</button>
        </nav>
        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:9px;color:var(--muted);line-height:1.7">演示账号数据仅保存在 localStorage。<br>清除浏览器数据后将重置。</div>
      </aside>
      <div class="account-main" id="accountMain"></div>
    </div>
  </div>
</main>
<div id="siteFooter"></div>
<script src="assets/pokedex.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const s = window.PK.session();
    if (s) document.getElementById('accountSideName').textContent = s.name;
    document.querySelectorAll('.account-nav a[href^="#"]').forEach(a => a.addEventListener('click', () => {
      document.querySelectorAll('.account-nav a').forEach(x => x.classList.remove('active'));
      a.classList.add('active');
    }));
  });
</script>
</body>
</html>
